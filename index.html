<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>2026 신진학자 연구지원사업 심사</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main id="app" class="wrap">
    <header>
      <div><p class="eyebrow">한국언론학회</p><h1>2026년 신진학자 연구지원사업 심사</h1><p class="muted">20개 연구의 심사자, 점수 및 의견을 모두 열람·수정할 수 있습니다.</p></div>
      <div id="progress" class="progress">0 / 20 입력 완료</div>
    </header>
    <p id="message" class="message" role="status" hidden></p>
    <section id="list"></section>
  </main>

  <iframe name="save-target" hidden title="저장 결과"></iframe>
  <script>
    function showBootError(text) {
      var el = document.querySelector("#message");
      if (!el) return;
      el.textContent = text;
      el.className = "message error";
      el.hidden = false;
    }
    window.addEventListener("error", function (e) {
      showBootError("스크립트 오류: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")");
    });
    setTimeout(function () {
      if (!window.__appJsLoaded) {
        showBootError("페이지 스크립트를 불러오지 못했습니다. 새로고침하거나 다른 브라우저/네트워크에서 시도해 주세요.");
      }
    }, 4000);
  </script>
  <script src="config.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
