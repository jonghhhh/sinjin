<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2026 신진학자 연구지원사업 심사</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main id="login" class="login">
    <form id="login-form" class="card">
      <p class="eyebrow">한국언론학회</p>
      <h1>2026년 신진학자<br>연구지원사업 심사</h1>
      <p class="muted">비밀번호를 입력해 주세요.</p>
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit">입장하기</button>
    </form>
  </main>

  <main id="app" class="wrap" hidden>
    <header>
      <div><p class="eyebrow">한국언론학회</p><h1>2026년 신진학자 연구지원사업 심사</h1><p class="muted">20개 연구의 심사자, 점수 및 의견을 모두 열람·수정할 수 있습니다.</p></div>
      <div id="progress" class="progress">0 / 20 입력 완료</div>
    </header>
    <p id="message" class="message" role="status" hidden></p>
    <section id="list"></section>
  </main>

  <iframe name="save-target" hidden title="저장 결과"></iframe>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
